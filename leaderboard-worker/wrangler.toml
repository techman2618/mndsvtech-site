name = "mound-hopper-scores"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "mound-hopper"
database_id = "4e347a7f-4e82-4bcf-aa84-09f61b96cecb"

[vars]
ALLOWED_ORIGINS = "https://www.mndsvtech.com,https://mndsvtech.com,http://localhost:8765"

[[rules]]
type = "Data"
globs = ["**/*.mobileconfig"]
fallthrough = true

[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]
