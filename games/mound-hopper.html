<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mound Hopper | MNDSVtech Games</title><meta name="description" content="Mound Hopper: fly a cell phone over the Grave Creek Mound and penitentiary watchtowers. A free game by Collins Tech LLC, Moundsville WV.">
<link rel="canonical" href="https://www.mndsvtech.com/games/mound-hopper.html"><link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0f1a30;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif}
#c{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
#back{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;z-index:2;background:#1d2b4acc;color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:14px}</style></head><body>
<a id="back" href="../games.html">← Games</a><canvas id="c" aria-label="Mound Hopper game. Tap, click or press space to flap."></canvas>
<script>
(()=>{const cv=document.getElementById('c'),x=cv.getContext('2d');let W=0,H=0,S=1,dpr=1;
const VH=640;// virtual height; width varies with aspect
function rs(){dpr=Math.min(window.devicePixelRatio||1,3);const w=innerWidth,h=innerHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);S=h/VH;W=w/S;H=VH;}
addEventListener('resize',rs);rs();
const G=1500,FLAP=-460,SPD=190,GAP=175,SPACE=260,GROUND=70,PR=17;
let st='start',p,obs,score,best=+(localStorage.getItem('moundHopperBest')||0),t=0,dead=0,gx=0;
function reset(){p={x:Math.min(W*0.3,160),y:H*0.42,v:0,r:0};obs=[];score=0;gx=0;for(let i=0;i<4;i++)add(W+120+i*SPACE,i);}
function add(ox,i){const k=(obs.length?obs[obs.length-1].k+1:i)%2;const lo=110,hi=H-GROUND-GAP-60;const gy=lo+Math.random()*(hi-lo);obs.push({x:ox,gy,k,w:k?110:96,done:0});}
function flap(e){if(e){e.preventDefault();}
 if(st==='start'){reset();st='play';p.v=FLAP;}else if(st==='play'){p.v=FLAP;}else if(st==='over'&&t-dead>0.6){reset();st='play';p.v=FLAP;}}
cv.addEventListener('pointerdown',flap,{passive:false});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter')flap(e);});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
// collision: bottom obstacle occupies y>gy+GAP, top occupies y<gy, within x..x+w (shapes approximated with inset rects)
function hit(o){const px=p.x,py=p.y,r=PR-3;if(px+r<o.x+8||px-r>o.x+o.w-8)return false;
 if(py-r<o.gy)return true; // top element
 const by=o.gy+GAP;if(o.k===0){// mound: dome, sample curve
  const cx=o.x+o.w/2,hw=o.w/2+30;const dx=Math.abs(px-cx)/hw;const top=by+ (H-GROUND-by)*Math.max(0,dx*dx*0.9-0.05);return py+r>top;}
 return py+r>by;}
function upd(dt){t+=dt;if(st==='start'){p&&(p.y=H*0.42+Math.sin(t*3)*10);gx=(gx+SPD*dt*0.5)%40;return}
 if(st==='over'){if(p.y<H-GROUND-PR){p.v+=G*dt;p.y=Math.min(H-GROUND-PR,p.y+p.v*dt);}return}
 p.v=Math.min(p.v+G*dt,700);p.y+=p.v*dt;p.r=Math.max(-0.45,Math.min(1.1,p.v/600));gx=(gx+SPD*dt)%40;
 for(const o of obs){o.x-=SPD*dt;if(!o.done&&o.x+o.w<p.x){o.done=1;score++;}}
 if(obs[0].x+obs[0].w<-60){obs.shift();add(obs[obs.length-1].x+SPACE);}
 if(p.y<-40)p.y=-40;
 if(p.y+PR>H-GROUND||obs.some(hit))die();}
function die(){st='over';dead=t;if(score>best){best=score;try{localStorage.setItem('moundHopperBest',best)}catch(e){}}}
// drawing
function sky(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4fb8ee');g.addColorStop(1,'#c9ecfb');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='#fff8';for(let i=0;i<5;i++){const cx=((i*220-t*15)%(W+300)+W+300)%(W+300)-150,cy=60+i*37%120;x.beginPath();x.arc(cx,cy,22,0,7);x.arc(cx+24,cy-8,26,0,7);x.arc(cx+50,cy,20,0,7);x.fill();}
 x.fillStyle='#7fa9c0';x.beginPath();x.moveTo(0,H-GROUND);for(let i=0;i<=W+40;i+=40)x.lineTo(i,H-GROUND-30-18*Math.sin((i+t*8)/90));x.lineTo(W,H-GROUND);x.fill();}
function ground(){x.fillStyle='#c8a165';x.fillRect(0,H-GROUND,W,GROUND);x.fillStyle='#5a9e3a';x.fillRect(0,H-GROUND,W,12);x.fillStyle='#4a8a2e';for(let i=-gx;i<W;i+=40)x.fillRect(i,H-GROUND,20,12);}
function mound(o){const by=o.gy+GAP,bt=H-GROUND,cx=o.x+o.w/2,hw=o.w/2+30;x.fillStyle='#5a9e3a';x.beginPath();x.moveTo(cx-hw,bt);x.quadraticCurveTo(cx-hw*0.55,by-6,cx,by);x.quadraticCurveTo(cx+hw*0.55,by-6,cx+hw,bt);x.fill();
 x.fillStyle='#6fb544';x.beginPath();x.moveTo(cx-hw*0.6,bt);x.quadraticCurveTo(cx-hw*0.3,by+30,cx-6,by+14);x.quadraticCurveTo(cx-hw*0.1,by+60,cx-hw*0.2,bt);x.fill();
 x.fillStyle='#3d7a26';for(let i=0;i<4;i++){x.fillRect(cx-hw*0.5+i*hw*0.33,by+40+((i*37)%30),3,6);} 
 x.fillStyle='#8a6a3a';x.fillRect(cx-1.5,by-22,3,22);x.fillStyle='#d33';x.fillRect(cx+1.5,by-22,12,8);}
function tower(X,y0,y1,w,down){// stone gothic tower from y0 to y1; crenellations at end facing gap
 x.fillStyle='#8f8f88';x.fillRect(X,Math.min(y0,y1),w,Math.abs(y1-y0));
 x.strokeStyle='#76766f';x.lineWidth=1.5;const a=Math.min(y0,y1),b=Math.max(y0,y1);for(let yy=a+((b-a)%18);yy<b;yy+=18){x.beginPath();x.moveTo(X,yy);x.lineTo(X+w,yy);x.stroke();for(let xx=X+((yy/18|0)%2?12:0);xx<X+w;xx+=24){x.beginPath();x.moveTo(xx,yy);x.lineTo(xx,yy+18);x.stroke();}}
 const e=down?y1:y1; // gap edge
 x.fillStyle='#7a7a73';const cw=w+16,bx=X-8;const dir=down?1:-1;// top tower hangs (down=true) edge at bottom
 x.fillRect(bx,down?e-14:e,cw,14);const m=5,mw=cw/(m*2-1);for(let i=0;i<m;i++)x.fillRect(bx+i*2*mw,down?e:e-14,mw,14);
 x.fillStyle='#2b2b2b';const wy=down?e-60:e+34;x.beginPath();x.moveTo(X+w/2-8,wy+26);x.lineTo(X+w/2-8,wy+8);x.arc(X+w/2,wy+8,8,Math.PI,0);x.lineTo(X+w/2+8,wy+26);x.fill();
 x.fillStyle='#ffd54a55';x.fillRect(X+w/2-5,wy+10,10,14);}
function drawObs(o){// top element always a hanging watchtower; bottom: mound (k0) or rising tower (k1)
 tower(o.x+10,-10,o.gy,o.w-20,true);
 if(o.k===0)mound(o);else{tower(o.x+5,H-GROUND,o.gy+GAP,o.w-10,false);}}
function phone(){x.save();x.translate(p.x,p.y);x.rotate(p.r);const w=26,h=42;
 x.fillStyle='#1d2b4a';rr(-w/2,-h/2,w,h,6);x.fillStyle='#3ee0f0';rr(-w/2+3,-h/2+5,w-6,h-12,3);
 x.fillStyle='#fff';x.beginPath();x.arc(-5,-6,4,0,7);x.arc(5,-6,4,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(-4,-5,2,0,7);x.arc(6,-5,2,0,7);x.fill();
 x.strokeStyle='#1d2b4a';x.lineWidth=2;x.beginPath();st==='over'?x.arc(0,8,5,Math.PI*1.1,Math.PI*1.9):x.arc(0,3,5,0.2,Math.PI-0.2);x.stroke();
 const fl=Math.sin(t*25)*6*(p.v<0?1:0.3);x.fillStyle='#fff';x.beginPath();x.ellipse(-w/2-6,-2+fl,9,4,-0.5,0,7);x.ellipse(w/2+6,-2+fl,9,4,0.5,0,7);x.fill();x.restore();}
function rr(a,b,w,h,r){x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h);x.fill();}
function txt(s,y,sz,c='#fff'){x.font=`800 ${sz}px system-ui,sans-serif`;x.textAlign='center';x.lineWidth=sz/6;x.strokeStyle='#1d2b4a';x.strokeText(s,W/2,y);x.fillStyle=c;x.fillText(s,W/2,y);}
function panel(y,h){x.fillStyle='#1d2b4add';const w=Math.min(W-30,340);x.beginPath();x.roundRect?x.roundRect(W/2-w/2,y,w,h,16):x.rect(W/2-w/2,y,w,h);x.fill();}
function draw(){x.setTransform(dpr*S,0,0,dpr*S,0,0);sky();if(st!=='start')obs.forEach(drawObs);ground();if(p)phone();
 if(st==='play')txt(score,70,48);
 if(st==='start'){panel(H*0.12,150);txt('Mound Hopper',H*0.12+50,36,'#3ee0f0');txt('Fly over Moundsville!',H*0.12+88,18);txt('Best: '+best,H*0.12+122,18);txt('Tap, click or press Space',H*0.66,20);txt('to start',H*0.66+28,20);}
 if(st==='over'){panel(H*0.2,190);txt('Game Over',H*0.2+50,38,'#ff6b6b');txt('Score: '+score,H*0.2+95,24);txt('Best: '+best,H*0.2+128,24);if(t-dead>0.6)txt('Tap to play again',H*0.2+168,18,'#3ee0f0');}}
let last=performance.now();p={x:Math.min(W*0.3,160),y:H*0.42,v:0,r:0};
function loop(n){let dt=(n-last)/1000;last=n;if(dt>0.05)dt=0.05;if(dt>0)upd(dt);draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);
window.__mh={get st(){return st},get score(){return score},get p(){return p},get obs(){return obs},GAP};
})();
</script></body></html>
