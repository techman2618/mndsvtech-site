let W=0,H=0,dpr=1,S=1;function rs(){dpr=Math.min(devicePixelRatio||1,2.5);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;S=Math.max(.62,Math.min(1.35,Math.min(W/600,H/430)))}addEventListener('resize',rs);rs();

// ---------- terrain ----------
const PXM=20,SEG=40;let pts,mounds,seedR;
function rnd(){seedR=(seedR*16807)%2147483647;return(seedR-1)/2147483646}
function genTo(i){while(pts.length<=i+3){const n=pts.length,xm=n*SEG/PXM;const ms=.22+Math.min(1,xm/3000)*.63;let s=pts.sl+(rnd()-.5)*.22*(1+xm/1500);const y=pts[n-1];s+=(-y/900)*.25;s=Math.max(-ms,Math.min(ms,s));pts.sl=s;pts.push(n<10?0:y+s*SEG)}}
function base(xx){const f=xx/SEG,i=Math.floor(f);if(i<1)return pts[0];genTo(i+2);const t=f-i,p0=pts[i-1],p1=pts[i],p2=pts[i+1],p3=pts[i+2];return .5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t*t+(-p0+3*p1-3*p2+p3)*t*t*t)}

// ---------- state ----------
let st='menu',car,V,wh,items,camx=0,camy=0,t=0,gas=0,brk=0,batt,dist,coinsRun,deadT=0,lowT=0,upT=0,why='',runId=null,nextBolt,nextCoin,nextMound,nextItemX;
function reset(){seedR=(Date.now()%2147483646)+1;pts=[0];pts.sl=0;mounds=[];V=VEH[sv.sel];const u=sv.up;
 V.k=260*(1+.14*u.sus);V.c=13*(1+.22*u.sus);V.mu=.85+.17*u.tir;V.tq=26000*V.eng*(1+.16*u.spd);V.ms=V.spin*(1+.1*u.spd)*V.eng;
 const y0=40;car={x:200,y:y0+V.r+30,vx:0,vy:0,a:0,w:0};wh=[-1,1].map(sg=>({x:200+sg*V.ax,y:y0+V.r,vx:0,vy:0,sp:0,th:0,on:0,sg}));
 items=[];batt=V.cap;dist=0;coinsRun=0;deadT=0;lowT=0;upT=0;why='';nextBolt=24*PXM;nextCoin=12*PXM;nextMound=180*PXM;nextItemX=0;camx=car.x;camy=car.y;}
function spawn(){const ahead=car.x+1600;while(nextMound<ahead+800){mounds.push({x:nextMound,w:170+rnd()*80,h:Math.min(160,60+nextMound/PXM*.04+rnd()*50)});nextMound+=(420+rnd()*380)*PXM}
 while(nextBolt<ahead){items.push({k:'b',x:nextBolt,y:hAt(nextBolt)+34});const m=nextBolt/PXM;nextBolt+=(240+m*.1+rnd()*80)*PXM}
 while(nextCoin<ahead){const m=nextCoin/PXM,v=5*(1+Math.floor(m/250)),n=4+Math.floor(rnd()*3);for(let i=0;i<n;i++){const xx=nextCoin+i*30;items.push({k:'c',x:xx,y:hAt(xx)+30+Math.sin(i/(n-1)*Math.PI)*22,v})}nextCoin+=(45+rnd()*35)*PXM}
 items=items.filter(o=>!o.got&&o.x>car.x-900)}
// ---------- physics ----------
const G=900;
function anchor(sg){const ax=sg*V.ax,ay=V.ay,c=Math.cos(car.a),s=Math.sin(car.a);const rx=c*ax-s*ay,ry=s*ax+c*ay;return{x:car.x+rx,y:car.y+ry,rx,ry,vx:car.vx-car.w*ry,vy:car.vy+car.w*rx}}
function step(dt){const M=V.M,I=M*(V.w*V.w+V.h*V.h)/12,c=Math.cos(car.a),s=Math.sin(car.a),ux=s,uy=-c,px=c,py=s;
 const thr=st==='play'&&batt>0?gas:0,br=st==='play'?brk:0;
 car.vy-=G*dt;let anyOn=0;
 for(const w of wh){const A=anchor(w.sg),dx=w.x-A.x,dy=w.y-A.y,rvx=w.vx-A.vx,rvy=w.vy-A.vy;
  const da=dx*ux+dy*uy,dl=dx*px+dy*py,va=rvx*ux+rvy*uy,vl=rvx*px+rvy*py;
  let fa=-(V.k*da+V.c*va),fl=-(3200*dl+60*vl);if(da>14)fa-=(da-14)*2500;if(da<-12)fa-=(da+12)*2500;
  const Fx=fa*ux+fl*px,Fy=fa*uy+fl*py;w.vx+=Fx*dt;w.vy+=Fy*dt-G*dt;car.vx-=Fx/M*dt;car.vy-=Fy/M*dt;car.w+=(A.rx*-Fy-A.ry*-Fx)/I*dt;
  // engine
  let tq=0;if(thr){tq=V.tq*thr*Math.max(0,1-w.sp/V.ms)}else if(br){if(w.sp>.5)tq=-V.tq*2.2*br;else if(batt>0)tq=-V.tq*.6*br*Math.max(0,1+w.sp/(V.ms*.4));else w.sp*=1-6*dt}
  if(!tq)w.sp*=1-.6*dt;
  w.sp+=tq*dt/(.5*V.r*V.r);car.w+=Math.sign(tq)*Math.min(1,Math.abs(tq)/V.tq)*.9*dt;
 }
 for(const w of wh){w.x+=w.vx*dt;w.y+=w.vy*dt;w.on=0;const sl=slope(w.x),nl=Math.hypot(sl,1),nx=-sl/nl,ny=1/nl,d=(w.y-hAt(w.x))*ny;
  if(d<V.r){w.on=1;anyOn=1;w.x+=nx*(V.r-d);w.y+=ny*(V.r-d);let vn=w.vx*nx+w.vy*ny;let jn=0;if(vn<0){jn=-vn;w.vx-=nx*vn;w.vy-=ny*vn}
   const tx=ny,ty=-nx,vt=w.vx*tx+w.vy*ty,slip=vt-w.sp*V.r;let jt=-slip/3;const lim=V.mu*(jn+G*dt*1.2);jt=Math.max(-lim,Math.min(lim,jt));
   w.vx+=jt*tx;w.vy+=jt*ty;w.sp-=jt*2/V.r}
  w.th+=w.sp*dt}
 if(!anyOn){if(thr)car.w-=4.2*dt;if(br)car.w+=4.2*dt}
 car.w*=1-.6*dt;car.vx*=1-.02*dt;car.x+=car.vx*dt;if(car.x<120){car.x=120;if(car.vx<0)car.vx=0;for(const w of wh)if(w.vx<0)w.vx*=.5}car.y+=car.vy*dt;car.a+=car.w*dt;
 // body contact
 const hw=V.w/2,hh=V.h/2,cc=Math.cos(car.a),ss=Math.sin(car.a);
 for(const [lx,ly,top] of [[-hw,-hh,0],[hw,-hh,0],[-hw,hh,1],[hw,hh,1],[0,hh+2,1],[-hw,0,0],[hw,0,0]]){const wx=car.x+cc*lx-ss*ly,wy=car.y+ss*lx+cc*ly,g=hAt(wx);
  if(wy<g){if(top&&st==='play'){crash('Smashed it!');return}const pen=g-wy;car.y+=pen;const rx=wx-car.x,ry=wy-car.y;const vpy=car.vy+car.w*rx;if(vpy<0){car.vy-=vpy*.8;car.w*=.7}car.vx*=1-1.5*dt}}
 if(st==='play'){const sp=Math.hypot(car.vx,car.vy);batt-=(1+2.4*Math.max(thr,batt>0?br:0))*dt;if(batt<=0){batt=0;over('Battery dead!');return}
  if(Math.cos(car.a)<-.2){upT+=dt;if(upT>2.5)crash('Flipped over!')}else upT=0;
  dist=Math.max(dist,(car.x-200)/PXM);
  for(const o of items)if(!o.got){const r=o.k==='b'?34:26;if(Math.hypot(o.x-car.x,o.y-car.y)<r+V.h/2||wh.some(w=>Math.hypot(o.x-w.x,o.y-w.y)<V.r+14)){o.got=1;o.ft=t;if(o.k==='b')batt=V.cap;else{coinsRun+=o.v}}}}
}

// ---------- drawing ----------
const sx=wx=>(wx-camx)*S+W*.33,sy=wy=>H*.6-(wy-camy)*S;
function rr(a,b,w,h,r){x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)}
function bg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5ab9ec');g.addColorStop(.65,'#cdeefb');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='#fff9';for(let i=0;i<5;i++){const cx=((i*260-camx*.05*S-t*6)%(W+300)+W+300)%(W+300)-150,cy=50+(i*53)%110;x.beginPath();x.arc(cx,cy,20,0,7);x.arc(cx+22,cy-8,25,0,7);x.arc(cx+46,cy,18,0,7);x.fill()}
 const hz=H*.52;// far Ohio valley hills (Ohio side)
 x.fillStyle='#8fb7a8';x.beginPath();x.moveTo(0,H);for(let i=0;i<=W+20;i+=20){const wx=i+camx*.12*S;x.lineTo(i,hz-40-26*Math.sin(wx/170)-14*Math.sin(wx/63))}x.lineTo(W,H);x.fill();
 // Ohio River
 x.fillStyle='#4f8fb8';x.fillRect(0,hz-6,W,30);x.strokeStyle='#ffffff66';x.lineWidth=2;for(let i=0;i<8;i++){const rx=((i*140-camx*.2*S+t*20)%(W+140)+W+140)%(W+140)-70;x.beginPath();x.moveTo(rx,hz+4+(i%3)*7);x.lineTo(rx+28,hz+4+(i%3)*7);x.stroke()}
 // near WV hills + penitentiary
 const off=camx*.3*S;x.fillStyle='#6f9c6a';x.beginPath();x.moveTo(0,H);for(let i=0;i<=W+20;i+=20){const wx=i+off;x.lineTo(i,hz+22-18*Math.sin(wx/230)-8*Math.sin(wx/90))}x.lineTo(W,H);x.fill();
 const P=1100;for(let k=Math.floor(off/P)-1;k<=Math.floor((off+W)/P)+1;k++){const px=k*P-off+300,gy=hz+20-18*Math.sin((k*P+300)/230);pen(px,gy)}}
function pen(px,gy){x.fillStyle='#9a958a';x.fillRect(px-70,gy-26,140,26);x.fillStyle='#857f74';for(const tx of [-80,70]){x.fillRect(px+tx,gy-58,14,58);for(let j=0;j<3;j++)x.fillRect(px+tx-3+j*7,gy-64,5,7)}
 x.fillRect(px-14,gy-48,28,48);for(let j=0;j<4;j++)x.fillRect(px-17+j*9,gy-55,6,8);x.fillStyle='#4a463f';for(let j=0;j<6;j++)x.fillRect(px-60+j*22,gy-18,6,9)}
function ground(){x.beginPath();x.moveTo(-5,H+5);const step=6;let first=1;for(let i=-6;i<=W+6;i+=step){const wx=camx+(i-W*.33)/S;x.lineTo(i,sy(hAt(wx)))}x.lineTo(W+6,H+5);x.closePath();
 const g=x.createLinearGradient(0,H*.4,0,H);g.addColorStop(0,'#a27a45');g.addColorStop(1,'#6e4f2b');x.fillStyle=g;x.fill();
 x.strokeStyle='#4f9a33';x.lineWidth=12*S;x.lineJoin='round';x.beginPath();for(let i=-6;i<=W+6;i+=step){const wx=camx+(i-W*.33)/S;const yy=sy(hAt(wx))+4*S;i<=-6?x.moveTo(i,yy):x.lineTo(i,yy)}x.stroke();
 x.strokeStyle='#6fc24a';x.lineWidth=4*S;x.stroke();
 for(const m of mounds){const X=sx(m.x);if(X<-60||X>W+60)continue;const top=sy(hAt(m.x));x.fillStyle='#7b5a33';x.fillRect(X-1.5*S,top-30*S,3*S,30*S);x.fillStyle='#d33';x.fillRect(X+1.5*S,top-30*S,16*S,10*S)}
 // distance posts every 100 m + best marker
 x.font=`800 ${12*S}px system-ui,sans-serif`;x.textAlign='center';for(let m=Math.floor((camx-W/S)/PXM/100)*100;m<(camx+W/S)/PXM;m+=100){if(m<=0)continue;const X=sx(200+m*PXM),Y=sy(hAt(200+m*PXM));x.fillStyle='#fff';x.fillRect(X-2*S,Y-26*S,4*S,26*S);x.fillStyle='#1d2b4a';x.fillText(m+' m',X,Y-30*S)}
 if(sv.best>20){const bxw=200+sv.best*PXM,X=sx(bxw);if(X>-20&&X<W+20){const Y=sy(hAt(bxw));x.strokeStyle='#ffd54a';x.lineWidth=3*S;x.setLineDash([6*S,5*S]);x.beginPath();x.moveTo(X,Y);x.lineTo(X,Y-80*S);x.stroke();x.setLineDash([]);x.fillStyle='#ffd54a';x.fillText('BEST',X,Y-86*S)}}}
function bolt(X,Y,s){x.save();x.translate(X,Y);x.scale(s,s);x.fillStyle='#ffd54a';x.strokeStyle='#8a5a00';x.lineWidth=2;x.beginPath();x.moveTo(4,-16);x.lineTo(-9,2);x.lineTo(-1,2);x.lineTo(-5,16);x.lineTo(9,-3);x.lineTo(1,-3);x.closePath();x.fill();x.stroke();x.restore()}

function drawItems(){for(const o of items){const X=sx(o.x),Y=sy(o.y);if(X<-30||X>W+30)continue;if(o.got){const k=(t-o.ft)*3;if(k>1)continue;x.globalAlpha=1-k;o.k==='b'?bolt(X,Y-k*40*S,S*(1+k)):coin(X,Y-k*40*S,S);x.globalAlpha=1;continue}
 if(o.k==='b'){x.fillStyle='#ffd54a44';x.beginPath();x.arc(X,Y,22*S*(1+.1*Math.sin(t*6)),0,7);x.fill();bolt(X,Y+Math.sin(t*3)*3*S,S*1.5)}else coin(X,Y,S)}}
function wheel(X,Y,r,th,big){x.save();x.translate(X,Y);x.rotate(th);x.fillStyle='#16161a';x.beginPath();x.arc(0,0,r,0,7);x.fill();x.fillStyle=big?'#9aa3ad':'#c9ccd2';x.beginPath();x.arc(0,0,r*.52,0,7);x.fill();x.strokeStyle='#333';x.lineWidth=2;for(let i=0;i<5;i++){const a=i/5*Math.PI*2;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(a)*r*.5,Math.sin(a)*r*.5);x.stroke()}x.fillStyle='#333';x.beginPath();x.arc(0,0,r*.14,0,7);x.fill();x.restore()}
function body(kind,black,face){const v=VEH[kind];if(kind==='phone'){const w=v.w,h=v.h;x.fillStyle=black?'#000':'#1d2b4a';rr(-w/2,-h/2,w,h,8);x.fill();if(black)return;x.fillStyle='#3ee0f0';rr(-w/2+5,-h/2+4,w-14,h-8,4);x.fill();x.fillStyle='#0f1a30';x.beginPath();x.arc(w/2-4.5,0,2,0,7);x.fill();
  const dead=face==='dead';x.fillStyle='#fff';x.beginPath();x.arc(6,-4,5,0,7);x.arc(20,-4,5,0,7);x.fill();if(dead){x.strokeStyle='#000';x.lineWidth=2;[6,20].forEach(e=>{x.beginPath();x.moveTo(e-3,-7);x.lineTo(e+3,-1);x.moveTo(e+3,-7);x.lineTo(e-3,-1);x.stroke()})}else{x.fillStyle='#000';x.beginPath();x.arc(8,-3,2.4,0,7);x.arc(22,-3,2.4,0,7);x.fill()}
  x.strokeStyle='#1d2b4a';x.lineWidth=2;x.beginPath();dead?x.arc(13,9,4,Math.PI*1.1,Math.PI*1.9):x.arc(13,4,4,.2,Math.PI-.2);x.stroke();x.fillStyle='#ffffff55';x.fillRect(-w/2+9,-h/2+6,4,h-12);return}
 // Cybertruck (local y down, front = +x)
 const P=[[-62,12],[-62,-6],[-4,-25],[62,-9],[62,12]];x.fillStyle=black?'#000':'#b9bec4';x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fill();if(black)return;
 x.strokeStyle='#8a9097';x.lineWidth=1.5;x.stroke();x.fillStyle='#1b2028';x.beginPath();x.moveTo(-30,-8);x.lineTo(-6,-21);x.lineTo(34,-11);x.lineTo(30,-6);x.lineTo(-26,-5);x.closePath();x.fill();
 x.strokeStyle='#9aa0a7';x.beginPath();x.moveTo(-8,-6);x.lineTo(-8,10);x.moveTo(-62,2);x.lineTo(62,2);x.stroke();x.fillStyle='#fff';x.fillRect(56,-10,7,3);x.fillStyle='#e33';x.fillRect(-63,-5,3,7);x.fillStyle='#2a2f36';x.fillRect(-62,10,124,3);
 x.fillStyle='#fff';x.globalAlpha=.9;x.fillRect(-4,-16,4,4);x.globalAlpha=1}
function drawCar(){for(const w of wh){const A=anchor(w.sg);x.strokeStyle='#555';x.lineWidth=5*S;x.beginPath();x.moveTo(sx(A.x),sy(A.y));x.lineTo(sx(w.x),sy(w.y));x.stroke()}
 for(const w of wh)wheel(sx(w.x),sy(w.y),V.r*S,w.th,sv.sel==='cyber');
 x.save();x.translate(sx(car.x),sy(car.y));x.scale(S,S);x.rotate(-car.a);body(sv.sel,0,st==='dead'&&why!=='Battery dead!'?'dead':'');x.restore()}
function hud(){const bw=Math.min(190,W*.42),bh=26,X=W/2-bw/2,Y=Math.max(10,12);const f=batt/V.cap;
 x.fillStyle='#1d2b4acc';rr(X-6,Y-5,bw+22,bh+10,10);x.fill();x.fillStyle='#fff';x.fillRect(X+bw,Y+7,6,12);x.strokeStyle='#fff';x.lineWidth=2.5;rr(X,Y,bw,bh,6);x.stroke();
 x.fillStyle=f>.5?'#43d15a':f>.22?'#ffd54a':(Math.sin(t*12)>0?'#ff4a4a':'#a22');rr(X+3,Y+3,Math.max(0,(bw-6)*f),bh-6,4);x.fill();
 bolt(X+16,Y+bh/2,.62);x.fillStyle='#fff';x.font='800 14px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=3;x.strokeStyle='#1d2b4a';const tt=Math.ceil(f*100)+'%';x.strokeText(tt,X+bw/2,Y+bh/2+1);x.fillText(tt,X+bw/2,Y+bh/2+1);
 x.textBaseline='alphabetic';x.textAlign='left';x.font='800 20px system-ui,sans-serif';const y2=Y+bh+30;x.lineWidth=4;
 const dt=fmt(dist)+' m';x.strokeText(dt,12,y2+8);x.fillStyle='#fff';x.fillText(dt,12,y2+8);
 x.textAlign='right';const ct='₿ '+fmt(coinsRun);x.strokeText(ct,W-12,y2+8);x.fillStyle='#ffd54a';x.fillText(ct,W-12,y2+8);
 if(batt<=0&&st==='play'){x.textAlign='center';x.font='800 22px system-ui,sans-serif';x.strokeText('Out of charge!',W/2,H*.3);x.fillStyle='#ff6a6a';x.fillText('Out of charge!',W/2,H*.3)}
 if(st==='dead'){x.textAlign='center';x.font='900 34px system-ui,sans-serif';x.strokeStyle='#1d2b4a';x.lineWidth=6;x.strokeText(why,W/2,H*.3);x.fillStyle='#ffd54a';x.fillText(why,W/2,H*.3)}}
function draw(){x.setTransform(dpr,0,0,dpr,0,0);bg();ground();drawItems();drawCar();if(st!=='menu')hud()}
// ---------- loop ----------
let last=performance.now(),acc=0;
function loop(n){let d=(n-last)/1000;last=n;if(d>.05)d=.05;t+=d;
 if(st==='play'||st==='dead'){acc+=d;while(acc>1/480){step(1/480);acc-=1/480}spawn();
  const lead=Math.max(-60,Math.min(160,car.vx*.35));camx+=(car.x+lead-camx)*Math.min(1,d*4);camy+=(car.y-camy)*Math.min(1,d*3);
  if(st==='dead'&&t-deadT>1.6){st='over';showOver()}}
 else if(st==='menu'){camx+=d*60;camy=hAt(camx)+40;car.x=camx;car.y=hAt(camx)+V.r+30;for(const w of wh){w.x=car.x+w.sg*V.ax;w.y=hAt(w.x)+V.r;w.th+=d*4}car.a=Math.atan(slope(car.x))*.8;spawn()}
 draw();requestAnimationFrame(loop)}
// ---------- UI ----------
function preview(kind,locked){const c=document.createElement('canvas'),w=150,h=78;c.width=w*2;c.height=h*2;c.style.width=w+'px';c.style.height=h+'px';const g=c.getContext('2d'),sv0=x;x=g;g.setTransform(2,0,0,2,0,0);const v=VEH[kind],sc=kind==='cyber'?.95:1.15;g.translate(w/2,h/2);g.scale(sc,sc);
 for(const sg of [-1,1]){g.strokeStyle=locked?'#000':'#555';g.lineWidth=4;g.beginPath();g.moveTo(sg*v.ax,-v.ay*0);g.lineTo(sg*v.ax,-v.ay+2);g.stroke();if(locked){g.fillStyle='#000';g.beginPath();g.arc(sg*v.ax,-v.ay+2,v.r,0,7);g.fill()}else wheel(sg*v.ax,-v.ay+2,v.r,0,kind==='cyber')}
 body(kind,locked,'');x=sv0;return c}
function upgradeRow(k){const L=sv.up[k],row=el('div',null,'up'),info=el('div',null,'ui');info.append(el('b',UPN[k][0]),el('span',UPN[k][1],'sm'));const pip=el('div',null,'pips');for(let i=0;i<MAXL;i++)pip.append(el('i',null,i<L?'on':''));info.append(pip);
 const b=el('button',L>=MAXL?'MAX':'₿ '+fmt(UPC[L]),'ub');b.disabled=L>=MAXL||sv.btc<UPC[L];b.onclick=()=>{if(sv.btc<UPC[L])return;sv.btc-=UPC[L];sv.up[k]++;save();showMenu()};row.append(info,b);return row}
function showMenu(){st='menu';reset();ov.classList.remove('hide');document.body.classList.remove('playing');
 const i=el('input');i.maxLength=12;i.value=pname;i.placeholder='Your name';i.id='nm';i.autocomplete='nickname';
 const vs=el('div',null,'vs');for(const k of ['phone','cyber']){const own=sv.own[k],card=el('div',null,'vc'+(sv.sel===k?' sel':'')+(own?'':' lock'));card.append(preview(k,!own),el('b',own?VEH[k].name:'??? Locked'));
  if(own){card.append(el('span',sv.sel===k?'✔ Selected':'Tap to drive','sm'));card.onclick=()=>{sv.sel=k;save();showMenu()}}
  else{const b=el('button','🔒 ₿ '+fmt(CYBER),'ub');b.disabled=sv.btc<CYBER;b.onclick=()=>{if(sv.btc<CYBER)return;sv.btc-=CYBER;sv.own[k]=1;sv.sel=k;save();showMenu()};card.append(b)}vs.append(card)}
 const go=el('button','▶ Drive!','go');
 bx.replaceChildren(el('h2','Mound Climb'),el('p','Garage · Best: '+fmt(sv.best)+' m','sm'),el('p','₿ '+fmt(sv.btc),'btc'),i,el('p','Vehicle','hd'),vs,el('p','Upgrades (all vehicles)','hd'),upgradeRow('spd'),upgradeRow('sus'),upgradeRow('tir'),go);
 const start=()=>{const n=clean(i.value);if(!n){i.focus();i.placeholder='Enter your name first';return}pname=n;try{localStorage.setItem('moundClimbName',n)}catch(_){}i.blur();ov.classList.add('hide');document.body.classList.add('playing');reset();st='play';startRun()};
 go.onclick=start;i.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')start()}}
function startRun(){runId=null;if(!API)return;fetch(API+'/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:'hc'})}).then(r=>r.json()).then(d=>{runId=d.run||null}).catch(()=>{})}
function table(rows,me){const tb=el('table'),hr=el('tr');['#','Name','Distance'].forEach(h=>hr.append(el('th',h)));tb.append(hr);rows.forEach((r,k)=>{const tr=el('tr');if(me(r))tr.className='me';tr.append(el('td',k+1),el('td',r.name),el('td',fmt(r.score)+' m'));tb.append(tr)});return tb}
function tabs(d,mk){const w=el('div'),bar=el('div',null,'tabs'),box=el('div');[['Today',d.day,5],['This Week',d.week,5],['All-Time',d.top,10]].forEach(([l,r,n])=>{const b=el('button',l);b.onclick=e=>{e&&e.stopPropagation();[...bar.children].forEach(z=>z.className='');b.className='on';r=r||[];box.replaceChildren(r.length?mk(r.slice(0,n)):el('p','No scores yet - be the first!','emp'))};bar.append(b)});w.append(bar,box);bar.children[1].click();return w}
function showOver(){document.body.classList.remove('playing');PT.clear();kg=kb=0;gas=brk=0;const m=Math.floor(dist),nb=m>sv.best;if(nb)sv.best=m;sv.btc+=coinsRun;save();
 const lb=el('p',API?'Loading leaderboard…':'','sm');let tb=el('div');const again=el('button','↻ Drive again','go'),gar=el('button','🔧 Garage','alt');
 bx.replaceChildren(el('h2',why),el('p',fmt(m)+' m'+(nb?' · NEW BEST!':''),'big'),el('p','+₿ '+fmt(coinsRun)+' collected · total ₿ '+fmt(sv.btc),'sm'),el('p','Best: '+fmt(sv.best)+' m','sm'),lb,tb,again,gar);ov.classList.remove('hide');
 again.onclick=()=>{ov.classList.add('hide');document.body.classList.add('playing');reset();st='play';startRun()};gar.onclick=showMenu;
 const fill=d=>{const g=tabs(d,a=>table(a,r=>d.ok&&r.name===pname&&r.score===m));tb.replaceWith(g);tb=g};const fail=()=>{lb.textContent='Offline - leaderboard unavailable. Your best: '+fmt(sv.best)+' m'};
 if(!API)return;if(runId&&m>0)fetch(API+'/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:'hc',name:pname,score:m,run:runId})}).then(r=>r.json()).then(d=>{if(!d.top)return fetch(API+'/top?game=hc').then(r=>r.json()).then(t=>{fill(t);lb.textContent='🌎 Global leaderboard · '+(d.error||'')});fill(d);lb.textContent='🌎 Global leaderboard'+(d.ok?' · you are #'+d.rank:'')}).catch(fail);
 else fetch(API+'/top?game=hc').then(r=>r.json()).then(d=>{fill(d);lb.textContent='🌎 Global leaderboard'}).catch(fail);runId=null}
window.__mc={setBatt:v=>batt=v,get gas(){return gas},get brk(){return brk},dbg:()=>[Math.round(car.vx),+car.a.toFixed(2),wh.map(w=>[w.on,+w.sp.toFixed(1)]),+slope(car.x).toFixed(2)],get st(){return st},get batt(){return batt},get dist(){return dist}};
