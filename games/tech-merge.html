 x.restore()}
function drawBody(b,a){x.save();x.translate(b.x,b.y);if(b.wob)x.scale(1+b.wob*.15,1-b.wob*.15);x.globalAlpha=a==null?1:a;x.beginPath();x.arc(0,0,b.r,0,7);x.fillStyle=COL[b.t]+'44';x.fill();x.lineWidth=2;x.strokeStyle=COL[b.t];x.stroke();icon(b.t,b.r);x.restore()}
/* ---------- physics ---------- */
function add(t,px,py){const b={id:nid++,t,r:R[t],x:px,y:py,vx:0,vy:0,age:0,wob:0};bodies.push(b);return b}
function addScore(p){score+=p;dfAcc+=p;if(dfAcc>=DF_N){dfAcc=DF_N;if(!dfReady){dfReady=true;fx.push({k:'txt',s:'DEFRAG READY!',x:VW/2,y:300,t:1.2,c:'#3ef08a'})}}}
function onMerge(t,px,py){if(tnow-lastM<1.3)chain++;else chain=1;lastM=tnow;mag=Math.min(MAG_N,mag+1);if(chain>=3)oc=Math.min(OC_N,oc+1);
 if(chain>=2)fx.push({k:'txt',s:'COMBO x'+chain,x:px,y:py-30,t:1,c:chain>=5?'#ff5ad1':chain>=3?'#ffd54a':'#3ee0f0'});for(let i=0;i<10;i++){const a=Math.random()*7;fx.push({k:'p',x:px,y:py,vx:Math.cos(a)*200,vy:Math.sin(a)*200,t:.5,c:COL[Math.min(t,10)]})}}
function mergeStep(){const dead=new Set();for(let i=0;i<bodies.length;i++){const a=bodies[i];if(dead.has(a.id))continue;for(let j=i+1;j<bodies.length;j++){const b=bodies[j];if(dead.has(b.id)||a.t!==b.t)continue;const dx=b.x-a.x,dy=b.y-a.y;if(dx*dx+dy*dy<(a.r+b.r+1)**2){dead.add(a.id);dead.add(b.id);doMerge(a,b);break}}}if(dead.size)bodies=bodies.filter(b=>!dead.has(b.id))}
function doMerge(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;if(a.t===10){addScore(QBONUS);shake=.5;fx.push({k:'txt',s:'QUANTUM SUPREMACY! +'+QBONUS,x:VW/2,y:330,t:2,c:'#ffd54a'});onMerge(10,mx,my);return}
 const n=add(a.t+1,mx,my);n.vx=(a.vx+b.vx)/2;n.vy=(a.vy+b.vy)/2-60;n.age=1;n.wob=1;addScore(PTS[a.t+1]);onMerge(a.t+1,mx,my)}
function phys(dt){const N=6,h=dt/N;for(let s=0;s<N;s++){for(const b of bodies){b.vy+=G*h;b.vx*=.996;b.vy*=.999;b.x+=b.vx*h;b.y+=b.vy*h;if(b.x-b.r<L){b.x=L+b.r;b.vx*=-.2}if(b.x+b.r>RT){b.x=RT-b.r;b.vx*=-.2}if(b.y+b.r>BOT){b.y=BOT-b.r;b.vy*=-.15;b.vx*=.97}}
 for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const a=bodies[i],b=bodies[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,rs=a.r+b.r;if(d2>=rs*rs||d2===0)continue;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=rs-d,ma=a.r*a.r,mb=b.r*b.r,ta=mb/(ma+mb),tb=ma/(ma+mb);a.x-=nx*o*ta;a.y-=ny*o*ta;b.x+=nx*o*tb;b.y+=ny*o*tb;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const jj=-1.1*rv;a.vx-=nx*jj*ta;a.vy-=ny*jj*ta;b.vx+=nx*jj*tb;b.vy+=ny*jj*tb}}}
 mergeStep()}
/* ---------- power-ups ---------- */
const PW=[{k:'mag',n:'Magnet Wipe',e:'🧲'},{k:'oc',n:'Overclock',e:'⚡'},{k:'df',n:'Defrag',e:'🧩'}];
function pwFrac(k){return k==='mag'?mag/MAG_N:k==='oc'?oc/OC_N:dfAcc/DF_N}
function pwRect(i){return{x:22+i*124,y:654,w:108,h:56}}
function usePw(k){if(pwFrac(k)<1||st!=='play')return;
 if(k==='mag'){if(!bodies.length)return;const m=Math.min(...bodies.map(b=>b.t));const gone=bodies.filter(b=>b.t===m);bodies=bodies.filter(b=>b.t!==m);gone.forEach(b=>{for(let i=0;i<6;i++)fx.push({k:'p',x:b.x,y:b.y,vx:(Math.random()-.5)*300,vy:-Math.random()*300,t:.6,c:'#ff5a5a'})});fx.push({k:'txt',s:'DEGAUSSED '+gone.length+' × '+NAMES[m]+'!',x:VW/2,y:300,t:1.4,c:'#ff7a7a'});fx.push({k:'ring',x:VW/2,y:400,t:.6});mag=0;shake=.25}
 if(k==='oc'){ocArm=true;fx.push({k:'txt',s:'TAP A PART TO OVERCLOCK',x:VW/2,y:300,t:1.6,c:'#ffd54a'})}
 if(k==='df'){dfAcc=0;dfReady=false;shake=.6;let n=0;const used=new Set();const ps=[];for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const a=bodies[i],b=bodies[j];if(a.t!==b.t)continue;const d=Math.hypot(a.x-b.x,a.y-b.y)-a.r-b.r;if(d<40)ps.push([d,a,b])}
  ps.sort((p,q)=>p[0]-q[0]);const dead=new Set();for(const[,a,b]of ps){if(dead.has(a.id)||dead.has(b.id))continue;dead.add(a.id);dead.add(b.id);n++;doMerge(a,b)}bodies=bodies.filter(b=>!dead.has(b.id));
  bodies.sort((a,b)=>b.t-a.t);bodies.forEach(b=>{b.vy-=250+Math.random()*150;b.vx+=(Math.random()-.5)*200});fx.push({k:'txt',s:'DEFRAG! '+n+' AUTO-MERGE'+(n===1?'':'S'),x:VW/2,y:300,t:1.6,c:'#3ef08a'})}}
/* ---------- input ---------- */
function vpt(e){return{x:(e.clientX-OX)/S,y:(e.clientY-OY)/S}}

function drop(){if(cool>0)return;const r=R[cur],px=Math.max(L+r,Math.min(RT-r,aimX));add(cur,px,TOP-20-r*.2).vy=80;cur=nxt;nxt=rnd();cool=.55}

const ov=document.getElementById('ov'),bx=document.getElementById('bx');

 ['Floppy → CD → Hard Drive → SSD → NVMe → RAM → CPU → GPU → Gaming PC → Server Rack → Quantum Computer','🧲 Magnet Wipe: deletes every one of the smallest part on the board','⚡ Overclock: chain 3+ merges fast to charge, then tap a part to upgrade it','🧩 Defrag: charges with score, shakes the board and auto-merges nearby pairs'].forEach(s=>ul.append(el('li',s)));

 else fetch(API+'/top?game=tm').then(r=>r.json()).then(d=>{fill(d);lb.textContent='🌎 Global top 10'}).catch(fail)}
/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;tnow+=dt;
 if(st==='play'){cool=Math.max(0,cool-dt);phys(dt);bodies.forEach(b=>{b.age+=dt;b.wob=Math.max(0,b.wob-dt*4)});
  const over=bodies.some(b=>b.age>1.5&&b.y-b.r<TOP);overT=over?overT+dt:Math.max(0,overT-dt*2);if(overT>2){showOver()}}
